<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="710" viewBox="0 0 1250 710" role="img" aria-labelledby="title desc">
<title id="title">Entrepreneur exploring a new website and mobile app</title>
<desc id="desc">Pastel lilac, rose and blue creative technology illustration of a male founder with laptop and floating website, app and analytics interfaces.</desc>
<defs>
