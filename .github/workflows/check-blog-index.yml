name: Check blog archive consistency
on:
  pull_request:
    paths:
      - 'blogs/**'
      - 'data/blog-posts.json'
      - 'data/blog-featured.json'
      - 'blog.html'
      - 'index.html'
      - 'about.html'
      - 'services.html'
      - 'scripts/build_blog_index.py'
      - 'assets/blog-*.webp'
      - '.github/workflows/check-blog-index.yml'
  push:
    branches: [main]
    paths:
      - 'blogs/**'
      - 'data/blog-posts.json'
      - 'data/blog-featured.json'
      - 'blog.html'
      - 'index.html'
      - 'about.html'
      - 'services.html'
      - 'scripts/build_blog_index.py'
      - 'assets/blog-*.webp'
      - '.github/workflows/check-blog-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published articles, images and featured links
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          index = json.loads((root / 'data/blog-posts.json').read_text(encoding='utf-8'))['posts']
          urls = [p['url'] for p in index]
          assert len(urls) == len(set(urls)), 'Duplicate blog entries'
          articles = {f'blogs/{p.name}' for p in (root/'blogs').glob('*.html')}
          assert articles <= set(urls), 'Missing articles from JSON: ' + str(articles - set(urls))
          assert all((root/p['image']).is_file() for p in index), 'An indexed blog image is missing'
          html = (root/'blog.html').read_text(encoding='utf-8')
          m = re.search(r'<!-- FALLBACK_JSON_START -->(.*?)<!-- FALLBACK_JSON_END -->', html, re.S)
          assert m, 'Missing blog HTML fallback'
          fallback = json.loads(m.group(1))
          assert set(urls) == {p['url'] for p in fallback}, 'Archive fallback disagrees with JSON index'
          assert f'{len(index)} stories to explore' in html, 'Archive article count is stale'
          featured_config = json.loads((root / 'data/blog-featured.json').read_text(encoding='utf-8'))
          pinned_url = featured_config.get('pinned_url')
          pinned = [p for p in index if p['url'] == pinned_url]
          assert len(pinned) == 1, 'Pinned featured article is missing from the blog index'
          featured_urls = [pinned_url] + [p['url'] for p in index if p['url'] != pinned_url][:2]
          assert len(featured_urls) == 3 and len(set(featured_urls)) == 3, 'Expected three unique featured stories'
          for name in ('index.html','about.html','services.html'):
              contents = (root/name).read_text(encoding='utf-8')
              m = re.search(r'<!-- STUDIO_FEATURED_START -->(.*?)<!-- STUDIO_FEATURED_END -->', contents, re.S)
              assert m, f'{name} missing featured stories marker'
              for url in featured_urls:
                  assert url in m.group(1), f'{name} missing configured featured article {url}'
              assert m.group(1).count('class="vf-home-journal-card"') == 3, f'{name} needs three cards'
          sitemap = (root/'sitemap.xml').read_text(encoding='utf-8')
          for path in articles:
              assert 'https://veefivee.com/'+path in sitemap, f'Sitemap missing {path}'
          print(f'Blog archive healthy: {len(index)} stories, {len(articles)} standalone blog posts, featured stories synced.')
          PY
