name: Build mobile industry images

on:
  push:
    paths:
      - 'scripts/build_mobile_industry_images.py'
      - 'assets/industry-*.webp'
      - '.github/workflows/build-mobile-industry-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: pip install Pillow==11.3.0
      - name: Build high-quality mobile versions
        run: python scripts/build_mobile_industry_images.py
      - name: Commit new image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/industry-*-mobile.webp
          if ! git diff --cached --quiet; then
            git commit -m "Generate optimized mobile industry images"
            git push
          fi
