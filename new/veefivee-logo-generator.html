<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700;800;900&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f6f9; --card:#ffffff; --line:#e7e6ee; --text:#282340; --muted:#77738c;
    --accent:#282340; --accent-ink:#ffffff; --soft:#f1f0f6;
    --font-weight-semibold:600;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:14px;line-height:1.4}
  header{padding:20px 24px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{margin:0;font-size:17px;font-weight:var(--font-weight-semibold);letter-spacing:-0.35px}
  header p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;padding:20px 24px;max-width:1400px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px}
  .preview{position:sticky;top:20px;align-self:start;padding:16px}
  .stage{border-radius:10px;min-height:420px;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;border:1px solid var(--line)}
  .stage.checker{background-color:#fff;background-image:
      linear-gradient(45deg,#eeedf3 25%,transparent 25%),linear-gradient(-45deg,#eeedf3 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#eeedf3 75%),linear-gradient(-45deg,transparent 75%,#eeedf3 75%);
    background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
  .stage.dark{background:#1d1b2b}
  canvas#view{max-width:100%;height:auto;display:block}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
  .dims{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;padding:6px 10px;border-radius:6px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
  .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .controls{padding:4px 0}
  section{padding:14px 18px;border-bottom:1px solid var(--line)}
  section:last-child{border-bottom:0}
  section h2{margin:0 0 12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .field{margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  .field > label{display:flex;justify-content:space-between;font-size:13px;font-weight:500;margin-bottom:6px}
  .field > label span{color:var(--muted);font-weight:400}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pair{display:grid;grid-template-columns:1fr 76px;gap:10px;align-items:center}
  input[type=text],input[type=number],select{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;color:var(--text);background:#fff;outline:none}
  input[type=text]:focus,input[type=number]:focus,select:focus{border-color:#a9a5c2;box-shadow:0 0 0 3px rgba(40,35,64,.08)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .color{display:grid;grid-template-columns:40px 1fr;gap:8px}
  input[type=color]{width:40px;height:36px;border:1px solid var(--line);border-radius:8px;padding:3px;background:#fff;cursor:pointer}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
  .check input{accent-color:var(--accent);width:16px;height:16px}
  .emojis{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .emojis button{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:20px;font-family:"Noto Color Emoji",sans-serif;line-height:1}
  .emojis button:hover{background:var(--soft)}
  .btn{height:40px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--text);font:inherit;font-weight:600;padding:0 14px;cursor:pointer;letter-spacing:-0.2px}
  .btn:hover{background:var(--soft)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{opacity:.92}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .actions .primary{grid-column:1/-1}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:900px){
    .wrap{grid-template-columns:1fr;padding:16px}
    .preview{position:static}
    .stage{min-height:260px}
    header{padding:16px}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Logo Generator</h1>
    <p>Text + emoji logo, export to PNG, WebP or JPG</p>
  </div>
  <button class="btn" id="reset">Reset</button>
</header>

<div class="wrap">
  <div class="card preview">
    <div class="stage checker" id="stage"><canvas id="view"></canvas></div>
    <div class="bar">
      <div class="dims" id="dims">–</div>
      <div class="seg" id="stageBg">
        <button data-bg="checker" class="on">Grid</button>
        <button data-bg="light">Light</button>
        <button data-bg="dark">Dark</button>
      </div>
    </div>
  </div>

  <div class="card controls">
    <section>
      <h2>Content</h2>
      <div class="field">
        <label>Logo text</label>
        <input type="text" data-k="text">
      </div>
      <div class="row">
        <div class="field">
          <label>Emoji</label>
          <input type="text" data-k="emoji">
        </div>
        <div class="field">
          <label>Emoji style</label>
          <select data-k="emojiStyle">
            <option value="android">Android (Noto)</option>
            <option value="system">System default</option>
          </select>
        </div>
      </div>
      <div class="emojis" id="quick"></div>
    </section>

    <section>
      <h2>Layout</h2>
      <div class="field">
        <label>Emoji position</label>
        <select data-k="position">
          <option value="left">Left of text</option>
          <option value="right">Right of text</option>
          <option value="top">Above text</option>
          <option value="bottom">Below text</option>
        </select>
      </div>
      <div class="field">
        <label>Space between emoji &amp; text <span>px</span></label>
        <div class="pair"><input type="range" data-k="gap" min="-60" max="200" step="1"><input type="number" data-k="gap" step="1"></div>
      </div>
      <div class="field">
        <label>Padding <span>px</span></label>
        <div class="pair"><input type="range" data-k="padding" min="0" max="200" step="1"><input type="number" data-k="padding" min="0" step="1"></div>
      </div>
    </section>

    <section>
      <h2>Text</h2>
      <div class="row">
        <div class="field">
          <label>Font</label>
          <select data-k="font">
            <option>Inter</option><option>Poppins</option><option>Montserrat</option><option>Manrope</option><option>DM Sans</option><option>System</option>
          </select>
        </div>
        <div class="field">
          <label>Weight</label>
          <select data-k="weight">
            <option value="300">300 Light</option><option value="400">400 Regular</option><option value="500">500 Medium</option>
            <option value="600">600 Semi-bold</option><option value="700">700 Bold</option><option value="800">800 Extra-bold</option><option value="900">900 Black</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Text size <span>px</span></label>
        <div class="pair"><input type="range" data-k="fontSize" min="8" max="300" step="1"><input type="number" data-k="fontSize" min="1" step="1"></div>
      </div>
      <div class="field">
        <label>Letter spacing <span>px</span></label>
        <div class="pair"><input type="range" data-k="letterSpacing" min="-10" max="30" step="0.05"><input type="number" data-k="letterSpacing" step="0.05"></div>
      </div>
      <div class="row">
        <div class="field">
          <label>Text color</label>
          <div class="color"><input type="color" data-k="textColor"><input type="text" data-k="textColor" data-hex></div>
        </div>
        <div class="field">
          <label>Case</label>
          <select data-k="textCase">
            <option value="none">As typed</option><option value="upper">UPPERCASE</option><option value="lower">lowercase</option><option value="title">Title Case</option>
          </select>
        </div>
      </div>
    </section>

    <section>
      <h2>Emoji</h2>
      <div class="field">
        <label>Emoji size <span>px</span></label>
        <div class="pair"><input type="range" data-k="emojiSize" min="8" max="400" step="1"><input type="number" data-k="emojiSize" min="1" step="1"></div>
      </div>
      <div class="field">
        <label>Vertical offset <span>px</span></label>
        <div class="pair"><input type="range" data-k="emojiOffsetY" min="-150" max="150" step="1"><input type="number" data-k="emojiOffsetY" step="1"></div>
      </div>
      <div class="field">
        <label>Rotation <span>deg</span></label>
        <div class="pair"><input type="range" data-k="emojiRotate" min="-180" max="180" step="1"><input type="number" data-k="emojiRotate" step="1"></div>
      </div>
      <label class="check"><input type="checkbox" data-k="emojiFlip"> Flip horizontally</label>
    </section>

    <section>
      <h2>Background</h2>
      <label class="check" style="margin-bottom:12px"><input type="checkbox" data-k="transparent"> Transparent background</label>
      <div class="row">
        <div class="field">
          <label>Background color</label>
          <div class="color"><input type="color" data-k="bgColor"><input type="text" data-k="bgColor" data-hex></div>
        </div>
        <div class="field">
          <label>Corner radius <span>px</span></label>
          <input type="number" data-k="radius" min="0" step="1">
        </div>
      </div>
    </section>

    <section>
      <h2>Export</h2>
      <div class="row">
        <div class="field">
          <label>Format</label>
          <select data-k="format">
            <option value="png">PNG</option><option value="webp">WebP</option><option value="jpeg">JPG</option>
          </select>
        </div>
        <div class="field">
          <label>Scale</label>
          <select data-k="exportScale">
            <option value="1">1x</option><option value="2">2x</option><option value="3">3x</option><option value="4">4x</option><option value="8">8x</option>
          </select>
        </div>
      </div>
      <div class="field" id="qualityField">
        <label>Quality <span id="qv"></span></label>
        <input type="range" data-k="quality" min="0.1" max="1" step="0.01">
      </div>
      <div class="field">
        <label>File name</label>
        <input type="text" data-k="filename">
      </div>
      <div class="actions">
        <button class="btn primary" id="download">Download</button>
        <button class="btn" id="copy">Copy PNG</button>
        <button class="btn" id="exportAll">PNG + WebP + JPG</button>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DEFAULTS = {
  text:'veefivee', emoji:'🌴', emojiStyle:'android',
  position:'left', gap:12, padding:24,
  font:'Inter', weight:'600', fontSize:64, letterSpacing:-0.35, textColor:'#282340', textCase:'none',
  emojiSize:64, emojiOffsetY:0, emojiRotate:0, emojiFlip:false,
  transparent:true, bgColor:'#282340', radius:0,
  format:'png', exportScale:'2', quality:0.92, filename:'veefivee-logo'
};
const FONTS = {
  'Inter':'Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif',
  'Poppins':'Poppins, sans-serif',
  'Montserrat':'Montserrat, sans-serif',
  'Manrope':'Manrope, sans-serif',
  'DM Sans':'"DM Sans", sans-serif',
  'System':'-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif'
};
const EMOJI_FONTS = {
  android:'"Noto Color Emoji", sans-serif',
  system:'"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif'
};
const QUICK = ['🌴','🏝️','🥥','🌿','🌊','☀️','🌺','🍍','🐚','⭐','🔥','🚀'];
const KEY = 'logoGen.v1';

let S = {...DEFAULTS};
try{ const saved = JSON.parse(localStorage.getItem(KEY)||'null'); if(saved) S = {...DEFAULTS, ...saved}; }catch(e){}

const $ = s => document.querySelector(s);
const inputs = [...document.querySelectorAll('[data-k]')];

function syncInputs(){
  inputs.forEach(el=>{
    const v = S[el.dataset.k];
    if(el.type==='checkbox') el.checked = !!v;
    else if(document.activeElement!==el) el.value = v;
  });
  $('#qualityField').style.display = S.format==='png' ? 'none' : '';
  $('#qv').textContent = Math.round(S.quality*100)+'%';
}

inputs.forEach(el=>{
  el.addEventListener('input',()=>{
    const k = el.dataset.k;
    let v;
    if(el.type==='checkbox') v = el.checked;
    else if(el.type==='range' || el.type==='number'){ v = parseFloat(el.value); if(isNaN(v)) return; }
    else v = el.value;
    if(el.hasAttribute('data-hex')){
      let h = v.trim(); if(!h.startsWith('#')) h = '#'+h;
      if(!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(h)) return;
      if(h.length===4) h = '#'+[...h.slice(1)].map(c=>c+c).join('');
      v = h.toLowerCase();
    }
    S[k] = v;
    // switching to JPG with transparent bg: JPG can't be transparent, warn once
    syncInputs();
    if(['text','emoji','font','weight','emojiStyle'].includes(k)) loadFonts(); else render();
  });
});

// quick emoji
QUICK.forEach(e=>{
  const b=document.createElement('button'); b.textContent=e; b.title=e;
  b.onclick=()=>{ S.emoji=e; syncInputs(); loadFonts(); };
  $('#quick').appendChild(b);
});

// stage background
document.querySelectorAll('#stageBg button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#stageBg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const st=$('#stage'); st.classList.remove('checker','dark');
    if(b.dataset.bg==='checker') st.classList.add('checker');
    if(b.dataset.bg==='dark') st.classList.add('dark');
    if(b.dataset.bg==='light') st.style.background='#fff'; else st.style.background='';
  };
});

$('#reset').onclick=()=>{ S={...DEFAULTS}; syncInputs(); loadFonts(); toast('Reset to defaults'); };

function applyCase(t){
  if(S.textCase==='upper') return t.toUpperCase();
  if(S.textCase==='lower') return t.toLowerCase();
  if(S.textCase==='title') return t.replace(/\S+/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());
  return t;
}

// Measure + lay out everything at a given scale
function measure(ctx, sc){
  const txt = applyCase(S.text||'');
  const chars = [...txt];
  ctx.font = `${S.weight} ${S.fontSize*sc}px ${FONTS[S.font]}`;
  const ls = S.letterSpacing*sc;
  const full = ctx.measureText(txt);
  const xs = []; let prefix='';
  for(let i=0;i<chars.length;i++){ xs.push(ctx.measureText(prefix).width + i*ls); prefix += chars[i]; }
  const tL = Math.max(0, full.actualBoundingBoxLeft||0);
  const tW = chars.length ? full.width + ls*(chars.length-1) + tL : 0;
  const tA = chars.length ? (full.actualBoundingBoxAscent||0) : 0;
  const tD = chars.length ? (full.actualBoundingBoxDescent||0) : 0;
  const tH = tA + tD;

  const emo = S.emoji||'';
  ctx.font = `${S.emojiSize*sc}px ${EMOJI_FONTS[S.emojiStyle]}`;
  const em = ctx.measureText(emo);
  const eL = emo ? (em.actualBoundingBoxLeft||0) : 0, eR = emo ? (em.actualBoundingBoxRight||em.width) : 0;
  const eA = emo ? (em.actualBoundingBoxAscent||S.emojiSize*sc*0.8) : 0, eD = emo ? (em.actualBoundingBoxDescent||0) : 0;
  const eW = eL+eR, eH = eA+eD;

  const hasE = eW>0, hasT = tW>0;
  const gap = (hasE&&hasT) ? S.gap*sc : 0;
  const off = S.emojiOffsetY*sc;
  let e={x:0,y:0}, t={x:0,y:0};
  if(S.position==='left' || S.position==='right'){
    e.y = -eH/2 + off; t.y = -tH/2;
    if(S.position==='left'){ e.x=0; t.x=eW+gap; } else { t.x=0; e.x=tW+gap; }
  } else {
    e.x = -eW/2; t.x = -tW/2;
    if(S.position==='top'){ e.y=off; t.y=eH+gap; } else { t.y=0; e.y=tH+gap+off; }
  }
  const boxes = [];
  if(hasE) boxes.push([e.x,e.y,e.x+eW,e.y+eH]);
  if(hasT) boxes.push([t.x,t.y,t.x+tW,t.y+tH]);
  if(!boxes.length) boxes.push([0,0,1,1]);
  const minX=Math.min(...boxes.map(b=>b[0])), minY=Math.min(...boxes.map(b=>b[1]));
  const maxX=Math.max(...boxes.map(b=>b[2])), maxY=Math.max(...boxes.map(b=>b[3]));
  const p = S.padding*sc;
  return {
    W: Math.max(1, Math.ceil(maxX-minX+2*p)), H: Math.max(1, Math.ceil(maxY-minY+2*p)),
    dx: p-minX, dy: p-minY, chars, xs, tL, tA, t, e, eL, eA, eW, eH, emo, hasE, hasT
  };
}

function paint(canvas, sc, forceBg){
  const ctx = canvas.getContext('2d');
  const L = measure(ctx, sc);
  canvas.width = L.W; canvas.height = L.H;
  ctx.clearRect(0,0,L.W,L.H);

  const bg = !S.transparent ? S.bgColor : (forceBg||null);
  if(bg){
    ctx.fillStyle = bg;
    const r = Math.min(S.radius*sc, L.W/2, L.H/2);
    if(r>0 && !forceBg){ ctx.beginPath(); ctx.roundRect(0,0,L.W,L.H,r); ctx.fill(); }
    else ctx.fillRect(0,0,L.W,L.H);
  }
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';

  if(L.hasT){
    ctx.font = `${S.weight} ${S.fontSize*sc}px ${FONTS[S.font]}`;
    ctx.fillStyle = S.textColor;
    const ox = L.t.x + L.dx + L.tL, oy = L.t.y + L.dy + L.tA;
    L.chars.forEach((ch,i)=> ctx.fillText(ch, ox + L.xs[i], oy));
  }
  if(L.hasE){
    ctx.save();
    ctx.font = `${S.emojiSize*sc}px ${EMOJI_FONTS[S.emojiStyle]}`;
    const cx = L.e.x + L.dx + L.eW/2, cy = L.e.y + L.dy + L.eH/2;
    ctx.translate(cx, cy);
    ctx.rotate(S.emojiRotate*Math.PI/180);
    if(S.emojiFlip) ctx.scale(-1,1);
    ctx.fillText(L.emo, -L.eW/2 + L.eL, -L.eH/2 + L.eA);
    ctx.restore();
  }
  return L;
}

function render(){
  const dpr = Math.max(1, window.devicePixelRatio||1);
  const c = $('#view');
  const L = paint(c, dpr);
  c.style.width = (L.W/dpr)+'px';
  const w1 = Math.round(L.W/dpr), h1 = Math.round(L.H/dpr), s = +S.exportScale;
  $('#dims').textContent = `${w1} × ${h1} px  ·  export ${w1*s} × ${h1*s} px`;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

async function loadFonts(){
  render();
  try{
    await Promise.all([
      document.fonts.load(`${S.weight} 64px ${FONTS[S.font]}`, S.text||'A'),
      document.fonts.load(`64px "Noto Color Emoji"`, S.emoji||'🌴')
    ]);
  }catch(e){}
  render();
}

function makeBlob(fmt){
  const c = document.createElement('canvas');
  paint(c, +S.exportScale, fmt==='jpeg' && S.transparent ? '#ffffff' : null);
  return new Promise(res=> c.toBlob(res, 'image/'+fmt, fmt==='png'?undefined:S.quality));
}
function save(blob, fmt){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (S.filename||'logo') + '.' + (fmt==='jpeg'?'jpg':fmt);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

$('#download').onclick = async ()=>{
  const blob = await makeBlob(S.format);
  if(!blob){ toast('This browser cannot export '+S.format.toUpperCase()); return; }
  save(blob, S.format);
  if(S.format==='jpeg' && S.transparent) toast('JPG has no transparency, used white background');
};
$('#exportAll').onclick = async ()=>{
  for(const f of ['png','webp','jpeg']){ const b = await makeBlob(f); if(b) save(b,f); await new Promise(r=>setTimeout(r,250)); }
};
$('#copy').onclick = async ()=>{
  try{
    const blob = await makeBlob('png');
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    toast('PNG copied to clipboard');
  }catch(e){ toast('Copy not supported here, use Download'); }
};

let tt;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }

window.addEventListener('resize', render);
syncInputs();
loadFonts();
document.fonts.ready.then(render);
</script>
