<radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#eff0ff" stop-opacity=".7"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7d5ff"/><stop offset=".54" stop-color="#f7d6fa"/><stop offset="1" stop-color="#b8e9f5"/></linearGradient>
<linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#293a78"/><stop offset=".5" stop-color="#444987"/><stop offset="1" stop-color="#212b5d"/></linearGradient>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5c5a2"/><stop offset=".7" stop-color="#d48e76"/><stop offset="1" stop-color="#c87c6b"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#352c43"/><stop offset="1" stop-color="#1e253f"/></linearGradient>
<linearGradient id="laptop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9ebfc"/><stop offset=".6" stop-color="#a7add3"/><stop offset="1" stop-color="#6b769f"/></linearGradient>
<filter id="shadow" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#52549c" flood-opacity=".23"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
<clipPath id="round"><rect x="0" y="0" width="1250" height="710" rx="30"/></clipPath>
</defs>
