<form action="https://formsubmit.co/veefivee.com@gmail.com" method="POST" style="max-width: 500px; margin: 20px auto; font-family: sans-serif;">
  
  <!-- Customizes the email subject line you receive -->
  <input type="hidden" name="_subject" value="New Consultation Request on VeeFivee!">
  
  <!-- Honeypot field to block spam bots -->
  <input type="text" name="_honey" style="display:none">

  <!-- Disable FormSubmit captcha page (optional, keeps users on a clean flow) -->
  <input type="hidden" name="_captcha" value="false">

  <div style="margin-bottom: 15px;">
    <label for="name" style="display: block; margin-bottom: 5px; font-weight: bold;">Full Name *</label>
    <input type="text" id="name" name="Name" required placeholder="Jane Doe" style="width: 100%; padding: 10px; box-sizing: border-box;">
  </div>

  <div style="margin-bottom: 15px;">
    <label for="email" style="display: block; margin-bottom: 5px; font-weight: bold;">Email Address *</label>
    <input type="email" id="email" name="Email" required placeholder="jane@example.com" style="width: 100%; padding: 10px; box-sizing: border-box;">
  </div>

  <div style="margin-bottom: 15px;">
    <label for="phone" style="display: block; margin-bottom: 5px; font-weight: bold;">Phone Number</label>
    <input type="tel" id="phone" name="Phone" placeholder="+1 234 567 8900" style="width: 100%; padding: 10px; box-sizing: border-box;">
  </div>

  <div style="margin-bottom: 15px;">
    <label for="date" style="display: block; margin-bottom: 5px; font-weight: bold;">Preferred Consultation Date</label>
    <input type="date" id="date" name="Preferred_Date" style="width: 100%; padding: 10px; box-sizing: border-box;">
  </div>

  <div style="margin-bottom: 15px;">
    <label for="topic" style="display: block; margin-bottom: 5px; font-weight: bold;">What do you need help with? *</label>
    <textarea id="topic" name="Consultation_Details" rows="4" required placeholder="Briefly describe your goals or questions..." style="width: 100%; padding: 10px; box-sizing: border-box;"></textarea>
  </div>

  <button type="submit" style="background-color: #2563eb; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%;">
    Request Consultation
  </button>

</form>
