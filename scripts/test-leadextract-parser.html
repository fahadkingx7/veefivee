<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeadExtract parser DOM tests</title>
  <style>body{font:16px/1.5 system-ui,sans-serif;max-width:950px;margin:3rem auto;padding:0 1rem;color:#1d1737}li{margin:.5rem 0}.pass{color:#18743c}.fail{color:#b11932}pre{white-space:pre-wrap;background:#f4f1fa;padding:1rem;border-radius:10px}</style>
</head>
<body>
  <h1>LeadExtract parser DOM tests</h1>
  <p id="summary" role="status">Running…</p>
  <ol id="results"></ol>
  <script src="../js/leadextract-parser.js"></script>
  <script>
  'use strict';
  const source = 'https://acme.studio/team';
  let passed = 0, failed = 0;
  const failures = [];
  function equal(actual, expected) {
    if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('Expected ' + JSON.stringify(expected) + '; received ' + JSON.stringify(actual));
  }
  function ok(value, message) { if (!value) throw new Error(message || 'Assertion failed'); }
  function parse(html) { return LeadExtractParser.parsePage({url:source, html}); }
  function test(name, run) {
    const item = document.createElement('li');
    try { run(); passed++; item.className = 'pass'; item.textContent = 'PASS ' + name; }
    catch (error) { failed++; failures.push({name, error:error.message}); item.className = 'fail'; item.textContent = 'FAIL ' + name; const pre = document.createElement('pre'); pre.textContent = error.message; item.append(pre); }
    document.getElementById('results').append(item);
  }
  function contactList(result) { return result.people.map(person => [person.name, person.email, person.phone]); }

  test('separate staff cards retain their own names and direct contacts', () => {
    const result = parse('<div class="team-members"><div class="team-card"><h3>Jane Doe</h3><p class="role">Owner</p><a href="mailto:jane@acme.studio">Email Jane</a><a href="tel:+442079460102">Direct line</a></div><div class="team-card"><h3>Sam Patel</h3><p class="role">Operations Manager</p><a href="mailto:sam@acme.studio">Email Sam</a><a href="tel:+923001234567">Mobile</a></div></div>');
    equal(contactList(result), [['Jane Doe', 'jane@acme.studio', '+442079460102'], ['Sam Patel', 'sam@acme.studio', '+923001234567']]);
    ok(result.people.every(person => person.sourceUrl === source && person.emailSourceUrl === source && person.phoneSourceUrl === source));
  });

  test('a person without contacts does not inherit the next staff card contacts', () => {
    const result = parse('<div class="team-members"><div class="staff-card"><h3>Jane Doe</h3><p>Owner</p></div><div class="staff-card"><h3>Sam Patel</h3><p>Manager</p><a href="mailto:sam@acme.studio">Email</a><a href="tel:+923001234567">Call</a></div></div>');
    equal(contactList(result), [['Jane Doe', '', ''], ['Sam Patel', 'sam@acme.studio', '+923001234567']]);
  });

  test('a published single given name is preserved in a staff card', () => {
    const result = parse('<div class="team-card"><h3>Fahad</h3><p>Founder</p><a href="mailto:fahad@acme.studio">Email</a></div>');
    equal(contactList(result), [['Fahad', 'fahad@acme.studio', '']]);
  });

  test('site footer contacts remain company contacts', () => {
    const result = parse('<div class="team-card"><h3>Jane Doe</h3><p>Owner</p></div><footer><a href="mailto:hello@acme.studio">Email us</a><a href="tel:+442079460101">Call us</a></footer>');
    equal(contactList(result), [['Jane Doe', '', '']]);
    ok(result.emails.some(item => item.value === 'hello@acme.studio'));
    ok(result.phones.some(item => item.value === '+442079460101'));
  });

  test('contacts repeated in both a staff card and footer are treated as company contacts', () => {
    const result = parse('<div class="team-card"><h3>Jane Doe</h3><p>Owner</p><a href="mailto:jane@acme.studio">Email</a><a href="tel:+442079460101">Call</a></div><footer><a href="mailto:jane@acme.studio">Company email</a><a href="tel:+442079460101">Company telephone</a></footer>');
    equal(contactList(result), [['Jane Doe', '', '']]);
  });

  test('generic inbox and explicitly labelled office numbers inside staff cards stay general', () => {
    const result = parse('<div class="staff-card"><h3>Jane Doe</h3><p>Owner</p><p>Email: <a href="mailto:info@acme.studio">info@acme.studio</a></p><p><span>Office phone:</span><a href="tel:+442079460101">+44 20 7946 0101</a></p></div>');
    equal(contactList(result), [['Jane Doe', '', '']]);
    ok(result.phones.some(item => item.value === '+442079460101'));
  });

  test('text contacts in a single card are extracted without joining adjoining elements', () => {
    const result = parse('<div class="profile-card"><h3>Jane Doe</h3><p class="position">Owner</p><p>Email: jane@acme.studio</p><p>Direct: +49 (0)30 1234 5678 ext. 19</p></div>');
    equal(contactList(result), [['Jane Doe', 'jane@acme.studio', '+493012345678 ext. 19']]);
    equal(result.emails.map(item => item.value), ['jane@acme.studio']);
  });

  test('a wrapper containing multiple profile cards is not itself a staff card', () => {
    const result = parse('<div class="profile-cards"><div class="profile-card"><h3>Jane Doe</h3><p>Owner</p></div><div class="profile-card"><h3>Sam Patel</h3><p>Manager</p><a href="mailto:sam@acme.studio">Email</a></div></div>');
    equal(contactList(result), [['Jane Doe', '', ''], ['Sam Patel', 'sam@acme.studio', '']]);
  });

  test('multiple staff headings in an ambiguous card are not cross associated', () => {
    const result = parse('<div class="staff-card"><h3>Jane Doe</h3><p>Owner</p><h3>Sam Patel</h3><p>Manager</p><a href="mailto:sam@acme.studio">Email</a></div>');
    equal(result.people.length, 0);
  });

  test('a second plain-text staff name in an ambiguous card prevents association', () => {
    const result = parse('<div class="staff-card"><h3>Jane Doe</h3><p>Owner</p><p>Sam Patel</p><p>Manager</p><a href="mailto:sam@acme.studio">Email</a></div>');
    equal(result.people.length, 0);
  });

  test('a shared switchboard beside two staff members remains a company contact', () => {
    const result = parse('<div class="team-card"><h3>Jane Doe</h3><p>Owner</p><a href="tel:+442079460101">Call</a></div><div class="team-card"><h3>Sam Patel</h3><p>Manager</p><a href="tel:+442079460101">Call</a></div>');
    equal(result.people.map(person => person.phone), ['', '']);
    equal(result.phones.length, 1);
  });

  test('testimonial cards and article bylines do not create staff records', () => {
    const result = parse('<section class="testimonials"><div class="team-card"><h3>Chris Reader</h3><p>Manager</p><a href="mailto:chris@acme.studio">Email</a></div></section><article itemtype="https://schema.org/Article"><div class="profile-card"><h3>Alex Writer</h3><p>Consultant</p><a href="mailto:alex@acme.studio">Email</a></div></article><article><div class="author-profile profile-card"><h3>Avery Author</h3><p>Consultant</p><a href="mailto:avery@acme.studio">Email</a></div></article>');
    equal(result.people.length, 0);
  });

  test('hidden and executable content is ignored', () => {
    const result = parse('<script>window.__leadextractExecuted = true; const email="secret@acme.studio";<\/script><div hidden>hidden@acme.studio</div><style>/* style@acme.studio */</style><p>hello@acme.studio</p>');
    equal(result.emails.map(item => item.value), ['hello@acme.studio']);
    equal(window.__leadextractExecuted, undefined);
  });

  test('JSON-LD graph references exclude article authors and preserve employee contacts', () => {
    const data = {'@graph':[
      {'@id':'#company', '@type':'LocalBusiness', name:'Acme Studio', employee:{'@id':'#staff'}, telephone:'+442079460101'},
      {'@id':'#staff', '@type':'Person', name:'Jane Doe', jobTitle:'Owner', email:'jane@acme.studio'},
      {'@type':'Article', author:{'@id':'#author'}},
      {'@id':'#author', '@type':'Person', name:'Alex Writer', jobTitle:'Consultant', worksFor:{'@id':'#company'}, email:'alex@acme.studio'},
    ]};
    const result = parse('<script type="application/ld+json">' + JSON.stringify(data) + '<\/script>');
    equal(result.businessName, 'Acme Studio');
    equal(contactList(result), [['Jane Doe', 'jane@acme.studio', '']]);
  });

  test('public links resolve and unsafe/private links are excluded', () => {
    const result = parse('<a href="/contact#map">Contact</a><a href="http://127.0.0.1/secret">Local</a><a href="javascript:alert(1)">Unsafe</a><a href="https://user:pass@acme.studio/">Credentials</a><a href="mailto:hello@acme.studio">Email</a>');
    equal(result.links, [{url:'https://acme.studio/contact', label:'Contact'}]);
  });

  const summary = document.getElementById('summary');
  summary.textContent = passed + ' passed, ' + failed + ' failed';
  summary.className = failed ? 'fail' : 'pass';
  document.title = (failed ? 'FAIL' : 'PASS') + ' — ' + summary.textContent;
  window.LeadExtractParserTestResults = {passed, failed, failures};
  </script>
</body>
</html>
