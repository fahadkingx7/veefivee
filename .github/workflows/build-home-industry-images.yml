name: Build homepage industry previews
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-home-industry-images.py'
      - '.github/workflows/build-home-industry-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare encoder
        run: python -m pip install pillow==11.3.0
      - name: Build and verify smaller previews
        run: python scripts/build-home-industry-images.py
      - name: Commit optimized images and homepage references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/industry-*-home.webp
          git diff --cached --quiet || (git commit -m "Publish lightweight homepage-only industry images" && git push)
